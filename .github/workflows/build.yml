name: Build and verify VideoLov
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run tools
      - run: npm test
      - run: node scripts/smoke.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: VideoLov-Windows-x64
          path: dist/VideoLov-Setup-*.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VideoLov-verification
          path: |
            test-results/report.json
            test-results/app.png
